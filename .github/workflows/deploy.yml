name: Deploy YuviTV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Both are optional — see cloudflare-worker/README.md. Unset, the
        # build behaves exactly as before (header-restricted streams stay
        # "VLC only" instead of playing in-page).
        env:
          VITE_STREAM_PROXY_URL: ${{ secrets.STREAM_PROXY_URL }}
          VITE_STREAM_PROXY_KEY: ${{ secrets.STREAM_PROXY_KEY }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
